name: Release

# Builds macOS Lens, signs the app and its disk image with a Developer ID, notarizes and staples both, then publishes
# the GitHub release and points the Homebrew cask at it. It runs only from Run workflow on main; a push never releases.
# One-time set-up and the steps to release are in CONTRIBUTING.md under "Signed releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z. It must match CFBundleShortVersionString in Resources/Info.plist on main.
        required: true
        type: string
      publish:
        description: Publish the release and update the cask. Leave off to build, sign and notarize only; the files stay on the run.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-lens-release
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and notarize
    runs-on: macos-26
    # macOS minutes cost ten times Linux ones. The build takes a few minutes and each of Apple's two checks a few more.
    timeout-minutes: 60
    environment: release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the branch and the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail "Releases run from main only, not $GITHUB_REF."
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "The version must look like 1.2.3, not '$VERSION'."
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$VERSION" == "$plist" ]] ||
            fail "Resources/Info.plist on main is $plist. Bump CFBundleShortVersionString and CFBundleVersion there first."
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            fail "v$VERSION is already tagged. Published versions are never replaced; release a new version."
          fi

      - name: Select Xcode
        run: |
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate and the notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          need() { [[ -n "$2" ]] || fail "$1 isn't set in the release environment. See CONTRIBUTING.md, Signed releases."; }
          need DEVELOPER_ID_P12_BASE64 "$DEVELOPER_ID_P12_BASE64"
          need DEVELOPER_ID_P12_PASSWORD "$DEVELOPER_ID_P12_PASSWORD"
          need DEVELOPER_ID_IDENTITY "$DEVELOPER_ID_IDENTITY"
          need NOTARY_KEY_P8_BASE64 "$NOTARY_KEY_P8_BASE64"
          need NOTARY_KEY_ID "$NOTARY_KEY_ID"
          need NOTARY_ISSUER_ID "$NOTARY_ISSUER_ID"
          [[ "$DEVELOPER_ID_IDENTITY" == "Developer ID Application: "* ]] ||
            fail "DEVELOPER_ID_IDENTITY must be the full name, such as 'Developer ID Application: Your Name (TEAMID1234)'."

          folder="$RUNNER_TEMP/signing"
          keychain="$folder/signing.keychain-db"
          mkdir -m 700 "$folder"
          (
            umask 077
            printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$folder/identity.p12"
            printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$folder/AuthKey.p8"
          )
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$folder/identity.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$folder/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          searched=("$keychain")
          while IFS= read -r existing; do
            searched+=("$existing")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "${searched[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -qF "\"$DEVELOPER_ID_IDENTITY\"" ||
            fail "The certificate in DEVELOPER_ID_P12_BASE64 isn't a valid '$DEVELOPER_ID_IDENTITY' identity."

          {
            echo "MACOS_LENS_SIGN_IDENTITY=$DEVELOPER_ID_IDENTITY"
            echo "MACOS_LENS_NOTARY_KEY=$folder/AuthKey.p8"
            echo "MACOS_LENS_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "MACOS_LENS_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Runs the tests, builds the universal app, signs, notarizes and staples it, zips it, builds, signs, notarizes
      # and staples the disk image, and writes SHA256SUMS and dist/release-notes.md. The native checks need a real
      # Mac's display and GPU, which hosted runners don't have, so run them on your Mac before releasing.
      - name: Test, build, sign and notarize
        env:
          MACOS_LENS_REQUIRE_UNIVERSAL: "1"
          MACOS_LENS_SKIP_NATIVE_CHECKS: "1"
        run: bash scripts/release.sh "$VERSION"

      - name: Check the files people download
        run: |
          fail() { echo "::error::$*"; exit 1; }
          cd dist
          shasum -a 256 -c SHA256SUMS
          cmp "macOS-Lens-$VERSION.dmg" macOS-Lens.dmg || fail "macOS-Lens.dmg differs from macOS-Lens-$VERSION.dmg."
          unpacked="$RUNNER_TEMP/unpacked"
          ditto -x -k "macOS-Lens-$VERSION.zip" "$unpacked"
          app="$unpacked/macOS Lens.app"
          archs="$(lipo -archs "$app/Contents/MacOS/MacOSLens")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || fail "The app isn't universal ($archs)."
          codesign --verify --deep --strict "$app"
          xcrun stapler validate -q "$app" || fail "The app in the zip has no notarization ticket."
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate -q "macOS-Lens-$VERSION.dmg" || fail "The disk image has no notarization ticket."
          spctl --assess --type open --context context:primary-signature --verbose "macOS-Lens-$VERSION.dmg"
          {
            echo "### macOS Lens $VERSION ($archs)"
            echo
            codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority=Developer ID Application|TeamIdentifier)='
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-lens-${{ inputs.version }}
          path: |
            dist/macOS-Lens-${{ inputs.version }}.zip
            dist/macOS-Lens-${{ inputs.version }}.dmg
            dist/macOS-Lens.dmg
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          # The zip and the disk images are already compressed.
          compression-level: 0

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"

  publish:
    name: Publish the release and update the cask
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow token creates the release and commits the cask; nothing else in the run can write.
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-lens-${{ inputs.version }}
          path: dist

      # The in-app updater and install.sh look for exactly these asset names under the tag vX.Y.Z.
      - name: Publish the release
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          gh release create "v$VERSION" "macOS-Lens-$VERSION.zip" "macOS-Lens-$VERSION.dmg" macOS-Lens.dmg SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "macOS Lens $VERSION" --notes-file release-notes.md

      # This repository is its own Homebrew tap, so the cask on main must match the published zip.
      - name: Point the Homebrew cask at the new zip
        run: |
          fail() { echo "::error::$*"; exit 1; }
          zip_sha="$(awk -v name="macOS-Lens-$VERSION.zip" '$2 == name { print $1 }' dist/SHA256SUMS)"
          [[ "$zip_sha" =~ ^[0-9a-f]{64}$ ]] || fail "SHA256SUMS has no checksum for macOS-Lens-$VERSION.zip."
          cask=Casks/macos-lens.rb
          gh api "repos/$GITHUB_REPOSITORY/contents/$cask?ref=main" > current.json
          jq -r .content current.json | base64 --decode > cask.rb
          sed -i -E -e "s/^(  version )\"[^\"]*\"/\1\"$VERSION\"/" -e "s/^(  sha256 )\"[^\"]*\"/\1\"$zip_sha\"/" cask.rb
          if ! grep -qx "  version \"$VERSION\"" cask.rb || ! grep -qx "  sha256 \"$zip_sha\"" cask.rb; then
            fail "Couldn't update version and sha256 in $cask."
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$cask" -f branch=main \
            -f message="Update the cask to $VERSION" -f sha="$(jq -r .sha current.json)" \
            -f content="$(base64 -w0 cask.rb)" > /dev/null
          echo "Casks/macos-lens.rb on main now installs $VERSION ($zip_sha)." >> "$GITHUB_STEP_SUMMARY"
